<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>When I Was Your Man | Premium Bloom</title>
    <style>
        :root {
            --bg: #050505;
            /* Gradient colors for a realistic look */
            --petal-light: #ffb7c5;
            --petal-mid: #ff85a1;
            --petal-dark: #d43f6b;
            --glow: #ff2d75;
            --stem: #1a331a;
        }

        body, html {
            margin: 0; padding: 0; height: 100%; width: 100%;
            background-color: var(--bg);
            overflow: hidden; display: flex;
            justify-content: center; align-items: center;
            font-family: 'Georgia', serif;
        }

        #overlay {
            position: fixed; z-index: 100;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, #1a1a1a 0%, #050505 100%);
            color: white; display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            cursor: pointer; text-align: center;
        }

        /* Flower Rising Animation */
        .flower-box {
            position: relative;
            display: flex; flex-direction: column; align-items: center;
            transform: translateY(120vh) scale(0.6);
            transition: transform 7s cubic-bezier(0.19, 1, 0.22, 1), opacity 3s;
            opacity: 0;
        }

        .flower-box.rise {
            transform: translateY(0) scale(1);
            opacity: 1;
        }

        /* Advanced Flower Head */
        .flower-head {
            position: relative;
            width: 100px;
            height: 100px;
            animation: gentleSway 5s ease-in-out infinite;
        }

        .petal {
            position: absolute;
            left: 50%;
            bottom: 0;
            transform-origin: bottom center;
            background: linear-gradient(to top, var(--petal-dark), var(--petal-mid), var(--petal-light));
            border-radius: 50% 50% 20% 20%;
            box-shadow: 0 0 20px rgba(255, 45, 117, 0.4);
            border: 0.5px solid rgba(255, 255, 255, 0.2);
        }

        /* Multi-layered Petals for Realism */
        .p1 { width: 45px; height: 75px; margin-left: -22.5px; z-index: 5; } /* Center */
        .p2 { width: 50px; height: 70px; margin-left: -25px; transform: rotate(-25deg); z-index: 4; }
        .p3 { width: 50px; height: 70px; margin-left: -25px; transform: rotate(25deg); z-index: 4; }
        .p4 { width: 55px; height: 65px; margin-left: -27.5px; transform: rotate(-50deg); z-index: 3; opacity: 0.8; }
        .p5 { width: 55px; height: 65px; margin-left: -27.5px; transform: rotate(50deg); z-index: 3; opacity: 0.8; }

        /* Glowing Center of Flower */
        .flower-head::after {
            content: '';
            position: absolute;
            bottom: 10px; left: 50%;
            width: 20px; height: 20px;
            background: white;
            border-radius: 50%;
            transform: translateX(-50%);
            box-shadow: 0 0 40px 10px var(--glow);
            z-index: 6;
            filter: blur(5px);
            animation: pulse 2s infinite;
        }

        .stem {
            width: 6px; height: 280px;
            background: linear-gradient(to bottom, #2d5a27, #1a331a, #050505);
            border-radius: 10px;
            position: relative;
        }

        /* Small Leaves on the Stem */
        .leaf {
            position: absolute;
            width: 30px; height: 15px;
            background: linear-gradient(to right, #2d5a27, #1a331a);
            border-radius: 0 100% 0 100%;
            left: 5px; top: 40px;
            transform: rotate(-20deg);
        }
        .leaf.right {
            left: -30px; top: 80px;
            border-radius: 100% 0 100% 0;
            transform: rotate(20deg);
        }

        .lyrics {
            margin-top: 40px; color: white; opacity: 0;
            transition: opacity 3s ease 5s;
            font-size: 1.2rem;
            text-shadow: 0 0 15px var(--glow);
            letter-spacing: 3px;
        }

        .rise .lyrics { opacity: 0.9; }

        @keyframes gentleSway {
            0%, 100% { transform: rotate(-2deg) translateX(0); }
            50% { transform: rotate(2deg) translateX(5px); }
        }

        @keyframes pulse {
            0%, 100% { transform: translateX(-50%) scale(1); opacity: 0.8; }
            50% { transform: translateX(-50%) scale(1.3); opacity: 1; }
        }

        /* Starry Background Particles */
        .star {
            position: absolute; background: white; border-radius: 50%;
            opacity: 0; animation: twinkle 8s infinite;
        }

        @keyframes twinkle {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            50% { opacity: 0.5; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }
    </style>
</head>
<body>

    <div id="overlay" onclick="start()">
        <h2 style="font-weight: 100; letter-spacing: 5px;">MOMENT OF BLOOM</h2>
        <p style="font-size: 12px; opacity: 0.6;">(Click to begin the music)</p>
    </div>

    <div class="flower-box" id="flower">
        <div class="flower-head">
            <div class="petal p5"></div>
            <div class="petal p4"></div>
            <div class="petal p3"></div>
            <div class="petal p2"></div>
            <div class="petal p1"></div>
        </div>
        <div class="stem">
            <div class="leaf"></div>
            <div class="leaf right"></div>
        </div>
        <div class="lyrics">"I should've bought you flowers..."</div>
    </div>

    <audio id="music">
        <source src="https://archive.org/download/clangers13/06%20-%20Bruno%20Mars%20-%20When%20I%20Was%20Your%20Man.mp3" type="audio/mpeg">
    </audio>

    <script>
        function start() {
            document.getElementById('overlay').style.display = 'none';
            const audio = document.getElementById('music');
            audio.play();

            document.getElementById('flower').classList.add('rise');

            // Create stars
            for(let i = 0; i < 60; i++) {
                let star = document.createElement('div');
                star.className = 'star';
                let size = Math.random() * 2 + 'px';
                star.style.width = size; star.style.height = size;
                star.style.left = Math.random() * 100 + 'vw';
                star.style.animationDelay = Math.random() * 8 + 's';
                document.body.appendChild(star);
            }
        }
    </script>
</body>
</html>
