<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flowers for you mae 💐</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b1016;
            --flower-glow: #23f0ff;
            --flower-main: #b2f9ff;
            --grass-light: #154734;
            --firefly: #faffbd;
        }

        body, html {
            margin: 0; padding: 0; height: 100%; width: 100%;
            background-color: var(--bg);
            overflow: hidden; display: flex;
            justify-content: center; align-items: center; 
            font-family: 'Playfair Display', serif;
        }

        /* Intro Screen - Images 6523 & 6524 */
        #overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: black;
            color: white; display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            z-index: 1000; cursor: pointer;
            text-align: center;
            transition: opacity 1s ease;
        }

        #overlay h1 { font-size: 64px; letter-spacing: 25px; margin: 0; font-weight: 400; }
        #overlay p { font-size: 20px; letter-spacing: 2px; margin-top: 10px; font-style: italic; }
        #overlay .bloom-title { font-size: 42px; letter-spacing: 12px; margin-top: 50px; }
        #overlay .sub-text { font-size: 16px; opacity: 0.5; margin-top: 15px; }

        /* Flower Garden - Image 6481 */
        .flower-garden {
            position: relative;
            width: 100%; height: 500px;
            display: flex; justify-content: center; align-items: flex-end;
            transform: translateY(120vh);
            transition: transform 6s cubic-bezier(0.19, 1, 0.22, 1);
        }
        .flower-garden.rise { transform: translateY(0); }

        /* Flower Structure */
        .flower { position: absolute; display: flex; flex-direction: column; align-items: center; z-index: 10; bottom: 50px; }
        .flower--1 { left: 50%; transform: translateX(-50%); z-index: 15; }
        .flower--2 { left: 44%; transform: translateX(-50%) scale(0.8); opacity: 0.9; }
        .flower--3 { left: 56%; transform: translateX(-50%) scale(0.8); opacity: 0.9; }

        .flower__leafs { position: relative; animation: sway 4s ease-in-out infinite alternate; }
        .flower__leaf {
            position: absolute; bottom: 0; left: 50%;
            transform-origin: bottom center;
            background: linear-gradient(to top, var(--flower-glow), var(--flower-main));
            border-radius: 50% 50% 20% 20%;
            box-shadow: 0 0 25px var(--flower-glow);
        }
        .flower__leaf--1 { width: 45px; height: 65px; margin-left: -22.5px; z-index: 5; }
        .flower__leaf--2 { width: 45px; height: 60px; margin-left: -22.5px; transform: rotate(-35deg); }
        .flower__leaf--3 { width: 45px; height: 60px; margin-left: -22.5px; transform: rotate(35deg); }
        .flower__leaf--4 { width: 45px; height: 55px; margin-left: -22.5px; transform: rotate(-65deg); opacity: 0.7; }
        .flower__white-circle {
            position: absolute; bottom: 15px; left: 50%;
            width: 18px; height: 18px; background: white;
            border-radius: 50%; transform: translateX(-50%);
            box-shadow: 0 0 30px 5px white; z-index: 10;
        }

        .stem { width: 5px; height: 320px; background: linear-gradient(to bottom, #154734, #000); border-radius: 5px; position: relative; }
        .stem-leaf { position: absolute; width: 30px; height: 15px; background: linear-gradient(to right, #154734, #071912); border-radius: 0 100% 0 100%; }
        .leaf-left { left: -30px; transform: rotate(20deg); border-radius: 100% 0 100% 0; }
        .leaf-right { left: 5px; transform: rotate(-20deg); }

        .grass-container { position: absolute; bottom: 0; width: 100%; height: 180px; display: flex; justify-content: center; align-items: flex-end; pointer-events: none; z-index: 5; }
        .grass-blade { width: 8px; background: linear-gradient(to top, #000, var(--grass-light)); border-radius: 100% 0 0 0; transform-origin: bottom; margin: 0 -2px; animation: sway 6s ease-in-out infinite alternate; }

        .firefly { position: absolute; width: 3px; height: 3px; background: var(--firefly); border-radius: 50%; box-shadow: 0 0 8px var(--firefly); animation: fly 15s infinite ease-in-out; opacity: 0; }

        .lyrics {
            position: fixed; bottom: 60px; width: 100%; text-align: center; color: white; opacity: 0;
            font-size: 28px; font-style: italic; letter-spacing: 2px;
            transition: opacity 3s ease 4s;
            text-shadow: 0 0 15px var(--flower-glow);
        }
        .rise ~ .lyrics { opacity: 1; }

        /* New Restart Button Styling */
        #restart-btn {
            position: fixed; top: 30px; right: 30px;
            background: transparent; color: white;
            border: 1px solid rgba(255,255,255,0.3);
            padding: 10px 20px; cursor: pointer;
            font-family: 'Playfair Display', serif;
            letter-spacing: 2px; font-size: 14px;
            opacity: 0; pointer-events: none;
            transition: opacity 2s ease;
            z-index: 2000;
        }
        #restart-btn.show { opacity: 0.6; pointer-events: auto; }
        #restart-btn:hover { opacity: 1; border-color: var(--flower-glow); }

        @keyframes sway { from { transform: rotate(-5deg); } to { transform: rotate(5deg); } }
        @keyframes fly {
            0% { transform: translate(0, 0); opacity: 0; }
            10% { opacity: 0.8; }
            50% { transform: translate(100px, -200px); }
            100% { transform: translate(-50px, -400px); opacity: 0; }
        }
    </style>
</head>
<body>

    <button id="restart-btn" onclick="resetAnimation()">BLOOM AGAIN</button>

    <div id="overlay" onclick="start()">
        <div style="margin-bottom: 80px;">
            <h1></h1>
            <p></p>
        </div>
        <h1 class="bloom-title">BLOOM FOR YOU</h1>
        <p class="sub-text">(Tap to start the experience)</p>
    </div>

    <div class="flower-garden" id="garden">
        <div class="flower flower--1">
            <div class="flower__leafs">
                <div class="flower__leaf flower__leaf--1"></div>
                <div class="flower__leaf flower__leaf--2"></div>
                <div class="flower__leaf flower__leaf--3"></div>
                <div class="flower__leaf flower__leaf--4"></div>
                <div class="flower__white-circle"></div>
            </div>
            <div class="stem">
                <div class="stem-leaf leaf-left" style="top: 50px;"></div>
                <div class="stem-leaf leaf-right" style="top: 100px;"></div>
            </div>
        </div>
        <div class="flower flower--2">
             <div class="flower__leafs">
                <div class="flower__leaf flower__leaf--1"></div>
                <div class="flower__leaf flower__leaf--2"></div>
                <div class="flower__leaf flower__leaf--3"></div>
                <div class="flower__white-circle"></div>
            </div>
            <div class="stem"></div>
        </div>
        <div class="flower flower--3">
             <div class="flower__leafs">
                <div class="flower__leaf flower__leaf--1"></div>
                <div class="flower__leaf flower__leaf--2"></div>
                <div class="flower__leaf flower__leaf--3"></div>
                <div class="flower__white-circle"></div>
            </div>
            <div class="stem"></div>
        </div>
        <div class="grass-container" id="grass"></div>
    </div>

    <div class="lyrics">Flowers for you mae</div>

    <audio id="music">
        <source src="https://archive.org/download/clangers13/06%20-%20Bruno%20Mars%20-%20When%20I%20Was%20Your%20Man.mp3" type="audio/mpeg">
    </audio>

    <script>
        const garden = document.getElementById('garden');
        const overlay = document.getElementById('overlay');
        const music = document.getElementById('music');
        const restartBtn = document.getElementById('restart-btn');

        function start() {
            overlay.style.opacity = '0';
            setTimeout(() => { overlay.style.display = 'none'; }, 1000);
            music.play();
            garden.classList.add('rise');
            initGarden();
            
            // Show restart button after 10 seconds
            setTimeout(() => { restartBtn.classList.add('show'); }, 10000);
        }

        function initGarden() {
            const grassBox = document.getElementById('grass');
            if(grassBox.children.length === 0) {
                for(let i = 0; i < 70; i++) {
                    let g = document.createElement('div');
                    g.className = 'grass-blade';
                    g.style.height = (90 + Math.random() * 110) + 'px';
                    g.style.opacity = 0.4 + Math.random();
                    g.style.animationDelay = (Math.random() * 5) + 's';
                    grassBox.appendChild(g);
                }
                for(let i = 0; i < 20; i++) {
                    let f = document.createElement('div');
                    f.className = 'firefly';
                    f.style.left = Math.random() * 100 + 'vw';
                    f.style.top = Math.random() * 100 + 'vh';
                    f.style.animationDelay = Math.random() * 10 + 's';
                    document.body.appendChild(f);
                }
            }
        }

        function resetAnimation() {
            restartBtn.classList.remove('show');
            garden.classList.remove('rise');
            music.pause();
            music.currentTime = 0;
            overlay.style.display = 'flex';
            setTimeout(() => { overlay.style.opacity = '1'; }, 100);
        }
    </script>
</body>
</html>
